---
layout: default
---

<article>
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      {{ page.date | date: "%B %d, %Y" }}
      {% if page.tags %}
        &nbsp;·&nbsp;
        {% for tag in page.tags %}{{ tag }}{% unless forloop.last %}, {% endunless %}{% endfor %}
      {% endif %}
    </div>
  </header>

<div class="post-content">
    {{ content }}
  </div>

  <div class="post-views">
    <span id="goatcounter-views">…</span> views
  </div>
</article>

<script data-goatcounter="https://lokesh-portfolio.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<script>
  var t = setInterval(function() {
    if (window.goatcounter && window.goatcounter.get_data) {
      clearInterval(t);
      var path = window.goatcounter.get_data()['p'];
      fetch('https://lokesh-portfolio.goatcounter.com/counter/' + encodeURIComponent(path) + '.json')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          document.getElementById('goatcounter-views').textContent = data.count;
        })
        .catch(function() {
          document.getElementById('goatcounter-views').textContent = '—';
        });
    }
  }, 100);
</script>
